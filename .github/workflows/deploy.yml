name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Next.js → Cloudflare Pages ──────────────────────────────────
  deploy-web:
    name: Deploy Web (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build for Cloudflare Pages
        working-directory: artifacts/web
        env:
          CF_PAGES: "1"
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          NEXT_PUBLIC_SITE_URL: "https://dostac.com"
        run: pnpm exec next-on-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=dostac-web --branch=main
          workingDirectory: artifacts/web

  # ── 2. API 서버 → Railway ──────────────────────────────────────────
  # Railway GitHub 연동으로 main push 시 자동 배포됩니다.
  # Railway 대시보드: https://railway.app → 프로젝트 → GitHub 레포 연결
  # Dockerfile.api 자동 감지 → railway.json 설정 적용
