openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DOSTAC website + admin API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public-products
  - name: public-notices
  - name: public-contact
  - name: admin-auth
  - name: admin-products
  - name: admin-notices
  - name: admin-inquiries
  - name: admin-translate
  - name: public-banners
  - name: admin-banners
  - name: public-about
  - name: admin-about
  - name: public-process
  - name: admin-process
  - name: public-category-translations
  - name: admin-category-translations
  - name: public-sub-category-translations
  - name: admin-sub-category-translations
  - name: admin-category-discover
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ───────────────────── PUBLIC ─────────────────────
  /public/products:
    get:
      operationId: listPublicProducts
      tags: [public-products]
      summary: List published products in a given language
      parameters:
        - { name: lang, in: query, required: true, schema: { $ref: "#/components/schemas/Lang" } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: subCategory, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicProduct" }
  /public/products/{slug}:
    get:
      operationId: getPublicProduct
      tags: [public-products]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: true, schema: { $ref: "#/components/schemas/Lang" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProduct" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/notices:
    get:
      operationId: listPublicNotices
      tags: [public-notices]
      parameters:
        - { name: lang, in: query, required: true, schema: { $ref: "#/components/schemas/Lang" } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicNotice" }
  /public/notices/{slug}:
    get:
      operationId: getPublicNotice
      tags: [public-notices]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: true, schema: { $ref: "#/components/schemas/Lang" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicNotice" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/banners:
    get:
      operationId: listPublicBanners
      tags: [public-banners]
      summary: List active banners ordered for the landing slider
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicBanner" }

  /public/about:
    get:
      operationId: getPublicAbout
      tags: [public-about]
      summary: Get the public About page content
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AboutContent" }

  /public/process:
    get:
      operationId: getPublicProcess
      tags: [public-process]
      summary: Get the public Process page content
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessContent" }

  /public/category-translations:
    get:
      operationId: listPublicCategoryTranslations
      tags: [public-category-translations]
      summary: List all category translation rows (slug → names in 5 languages)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryTranslationRow" }

  /public/sub-category-translations:
    get:
      operationId: listPublicSubCategoryTranslations
      tags: [public-sub-category-translations]
      summary: List all sub-category translation rows (slug → names in 5 languages)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubCategoryTranslationRow" }

  /public/contact-inquiries:
    post:
      operationId: createContactInquiry
      tags: [public-contact]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInquiryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ───────────────────── ADMIN AUTH ─────────────────────
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /admin/auth/me:
    get:
      operationId: adminGetMe
      tags: [admin-auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────── ADMIN PRODUCTS ─────────────────────
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin-products]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminProduct" }
    post:
      operationId: adminCreateProduct
      tags: [admin-products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
  /admin/products/upsert-by-slug:
    put:
      operationId: adminUpsertProductsBySlug
      tags: [admin-products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpsertProductsBySlugBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUpsertProductResult" }

  /admin/products/{id}:
    get:
      operationId: adminGetProduct
      tags: [admin-products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: adminUpdateProduct
      tags: [admin-products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
    delete:
      operationId: adminDeleteProduct
      tags: [admin-products]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  # ───────────────────── ADMIN NOTICES ─────────────────────
  /admin/notices:
    get:
      operationId: adminListNotices
      tags: [admin-notices]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminNotice" }
    post:
      operationId: adminCreateNotice
      tags: [admin-notices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminNoticeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotice" }
  /admin/notices/{id}:
    get:
      operationId: adminGetNotice
      tags: [admin-notices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotice" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: adminUpdateNotice
      tags: [admin-notices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminNoticeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotice" }
    delete:
      operationId: adminDeleteNotice
      tags: [admin-notices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  # ───────────────────── ADMIN INQUIRIES ─────────────────────
  /admin/inquiries:
    get:
      operationId: adminListInquiries
      tags: [admin-inquiries]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, in_progress, quoted, contracted, completed]
        - name: productSlug
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Inquiry" }
  /admin/inquiries/summary:
    get:
      operationId: adminInquiriesSummary
      tags: [admin-inquiries]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquirySummary" }
  /admin/inquiries/{id}:
    get:
      operationId: adminGetInquiry
      tags: [admin-inquiries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inquiry" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: adminUpdateInquiry
      tags: [admin-inquiries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquiryUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inquiry" }

  # ───────────────────── ADMIN BANNERS ─────────────────────
  /admin/banners:
    get:
      operationId: adminListBanners
      tags: [admin-banners]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminBanner" }
    post:
      operationId: adminCreateBanner
      tags: [admin-banners]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBannerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
  /admin/banners/reorder:
    post:
      operationId: adminReorderBanners
      tags: [admin-banners]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerReorderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /admin/banners/{id}:
    get:
      operationId: adminGetBanner
      tags: [admin-banners]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: adminUpdateBanner
      tags: [admin-banners]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBannerInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
    delete:
      operationId: adminDeleteBanner
      tags: [admin-banners]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  # ───────────────────── ADMIN ABOUT ─────────────────────
  /admin/about:
    get:
      operationId: adminGetAbout
      tags: [admin-about]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AboutContent" }
    put:
      operationId: adminUpdateAbout
      tags: [admin-about]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AboutContentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AboutContent" }

  # ───────────────────── ADMIN PROCESS ─────────────────────
  /admin/process:
    get:
      operationId: adminGetProcess
      tags: [admin-process]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessContent" }
    put:
      operationId: adminUpdateProcess
      tags: [admin-process]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessContentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessContent" }

  # ───────────────────── ADMIN CATEGORY TRANSLATIONS ─────────────────────
  /admin/category-translations:
    get:
      operationId: adminListCategoryTranslations
      tags: [admin-category-translations]
      summary: List all category translation rows
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryTranslationRow" }
    put:
      operationId: adminSaveCategoryTranslations
      tags: [admin-category-translations]
      summary: Bulk upsert category translations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/CategoryTranslationRow" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryTranslationRow" }

  # ───────────────────── ADMIN SUB-CATEGORY TRANSLATIONS ─────────────────────
  /admin/sub-category-translations:
    get:
      operationId: adminListSubCategoryTranslations
      tags: [admin-sub-category-translations]
      summary: List all sub-category translation rows
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubCategoryTranslationRow" }
    put:
      operationId: adminSaveSubCategoryTranslations
      tags: [admin-sub-category-translations]
      summary: Bulk upsert sub-category translations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/SubCategoryTranslationRow" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubCategoryTranslationRow" }

  # ───────────────────── ADMIN CATEGORY DISCOVER ─────────────────────
  /admin/category-discover:
    get:
      operationId: adminDiscoverCategorySlugs
      tags: [admin-category-discover]
      summary: Return distinct category and sub-category slugs from published products
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryDiscoverResult" }

  # ───────────────────── ADMIN TRANSLATE ─────────────────────
  /admin/translate:
    post:
      operationId: adminTranslate
      tags: [admin-translate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslateResult" }

components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Lang:
      type: string
      enum: [ko, en, ja, zh, vi]

    Translation:
      type: object
      required: [lang, name, headline, valueProp, body, features, material]
      properties:
        lang: { $ref: "#/components/schemas/Lang" }
        name: { type: string }
        headline: { type: string }
        valueProp: { type: string }
        body: { type: string }
        features: { type: string }
        material: { type: string }

    NoticeTranslation:
      type: object
      required: [lang, title, excerpt, body]
      properties:
        lang: { $ref: "#/components/schemas/Lang" }
        title: { type: string }
        excerpt: { type: string }
        body: { type: string }

    PublicProduct:
      type: object
      required: [id, slug, category, subCategory, sortOrder, name, headline, valueProp, body, features, material, certs]
      properties:
        id: { type: integer }
        slug: { type: string }
        category: { type: string }
        subCategory: { type: string }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }
        name: { type: string }
        headline: { type: string }
        valueProp: { type: string }
        body: { type: string }
        features:
          type: array
          items: { type: string }
        material: { type: string }
        certs:
          type: array
          items: { type: string }

    PublicNotice:
      type: object
      required: [id, slug, category, region, publishedAt, title, excerpt, body]
      properties:
        id: { type: integer }
        slug: { type: string }
        category: { type: string }
        region: { type: string }
        publishedAt: { type: string, format: date-time }
        thumbnailUrl: { type: ["string", "null"] }
        title: { type: string }
        excerpt: { type: string }
        body: { type: string }

    AdminUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string }

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AdminProduct:
      type: object
      required: [id, slug, category, subCategory, sortOrder, published, certs, translations, createdAt, updatedAt]
      properties:
        id: { type: integer }
        slug: { type: string }
        category: { type: string }
        subCategory: { type: string }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }
        published: { type: boolean }
        certs:
          type: array
          items: { type: string }
        translations:
          type: array
          items: { $ref: "#/components/schemas/Translation" }
        missingTranslations:
          type: array
          items: { $ref: "#/components/schemas/MissingTranslationInfo" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MissingTranslationInfo:
      type: object
      required: [type, slug]
      properties:
        type:
          type: string
          enum: [category, subCategory]
        slug: { type: string }

    AdminProductInput:
      type: object
      required: [slug, category, subCategory, sortOrder, published, certs, translations]
      properties:
        slug: { type: string }
        category: { type: string }
        subCategory: { type: string }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }
        published: { type: boolean }
        certs:
          type: array
          items: { type: string }
        translations:
          type: array
          items: { $ref: "#/components/schemas/Translation" }

    AdminUpsertProductsBySlugBody:
      type: array
      items: { $ref: "#/components/schemas/AdminProductInput" }

    AdminUpsertProductResult:
      type: object
      required: [slug]
      properties:
        slug: { type: string }
        action:
          type: string
          enum: [created, updated]
        product: { $ref: "#/components/schemas/AdminProduct" }
        error: { type: string }

    AdminNotice:
      type: object
      required: [id, slug, category, region, published, publishedAt, translations]
      properties:
        id: { type: integer }
        slug: { type: string }
        category: { type: string }
        region: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        published: { type: boolean }
        publishedAt: { type: string, format: date-time }
        translations:
          type: array
          items: { $ref: "#/components/schemas/NoticeTranslation" }

    AdminNoticeInput:
      type: object
      required: [slug, category, region, published, publishedAt, translations]
      properties:
        slug: { type: string }
        category: { type: string }
        region: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        published: { type: boolean }
        publishedAt: { type: string, format: date-time }
        translations:
          type: array
          items: { $ref: "#/components/schemas/NoticeTranslation" }

    Inquiry:
      type: object
      required:
        [
          id,
          name,
          email,
          company,
          inquiryType,
          message,
          whatsapp,
          country,
          quantity,
          productInterest,
          customization,
          status,
          adminNote,
          source,
          createdAt,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        company: { type: string }
