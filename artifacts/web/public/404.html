<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Dostac</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F0E8;font-family:system-ui,sans-serif;color:#0D1117}
    .wrap{text-align:center;padding:2rem}
    h1{font-size:5rem;font-weight:700;letter-spacing:-2px;line-height:1}
    p{font-size:1.125rem;color:#6B7280;margin-top:0.75rem}
    a{display:inline-block;margin-top:1.75rem;padding:0.625rem 1.5rem;background:#8B5E3C;color:#fff;border-radius:0.5rem;text-decoration:none;font-size:0.875rem;font-weight:500}
    a:hover{opacity:0.88}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>Page not found</p>
    <a href="/">Go home</a>
  </div>
</body>
</html>
